<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <meta name="theme-color" content="#0b0b0e">
    <title>Социальная сеть</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="box">
      <div class="profile-row">
        <img class="avatar" id="profileAvatar" src="https://litmir.club/data/Author/279000/279758/Фото_Нуремхет_Аноним_b86a9.jpg" alt="Аватар">
        <input type="file" id="avatarUpload" class="avatar-input" accept="image/*">
        <div class="nick-wrap">
          <input type="text" class="nick-input" id="nicknameInput" placeholder="Введите ник" maxlength="30" autocomplete="nickname">
          <div class="nick-error-msg" id="nickErrorMsg" role="alert">❌ Этот ник уже занят!</div>
        </div>
        <button class="bell" id="bellBtn" type="button" aria-label="Уведомления">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="bell-count" id="notifCount">0</span>
        </button>
      </div>

      <div class="tabs" role="tablist">
        <button id="tabFeed" class="active" type="button">лента</button>
        <button id="tabCreate" type="button">создать пост</button>
        <button id="tabProfile" type="button">профиль</button>
      </div>

      <div class="notif-panel" id="notificationPanel"></div>

      <div id="feedSection" class="section active">
        <div class="posts-list" id="postsListFeed">
          <div class="empty-posts">Загрузка постов...</div>
        </div>
      </div>

      <div id="createSection" class="section">
        <div class="create-post">
          <textarea class="post-input" id="postText" maxlength="5000" placeholder="Что нового?"></textarea>
          <div class="media-preview" id="mediaPreview"></div>
          <button class="attach-btn" id="attachBtn" type="button" title="Прикрепить файл">
            <img src="https://media.tenor.com/jtS4RMiJDXUAAAAj/clippy-windows-xp.gif" alt="прикрепить">
          </button>
          <input type="file" id="mediaUpload" accept="image/*,video/*" multiple hidden>
          <div id="uploadStatus" class="upload-status" aria-live="polite"></div>
          <button class="btn" id="publishBtn" type="button">Опубликовать</button>
        </div>
      </div>

      <div id="profileSection" class="section">
        <div class="profile-info">
          <img id="profileBigAvatar" src="https://litmir.club/data/Author/279000/279758/Фото_Нуремхет_Аноним_b86a9.jpg" alt="аватар">
          <h3 id="profileNickname">ТВОЙ НИК ТУТ</h3>
          <p>Мои посты:</p>
        </div>
        <div class="posts-list" id="postsListProfile">
          <div class="empty-posts">Нет постов</div>
        </div>
      </div>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
